<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101713"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icon-192.png"><title>Wavebox — Your Music</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside class="sidebar"><div class="brand">◉ <span>Wavebox</span></div><button class="nav active" id="homeBtn">⌂ &nbsp; Home</button><div class="library-title">YOUR LIBRARY</div><div id="playlists" class="playlist-nav"></div><p class="hint">Edit <code>music.js</code> to add playlists and songs.</p></aside><main><header><div><div class="eyebrow">YOUR PERSONAL MUSIC SPACE</div><h1 id="pageTitle">Your Library</h1><p id="pageSubtitle">Choose a playlist and press play.</p></div><div class="header-disc" aria-hidden="true">◉</div></header><section id="overview"><h2>Made for you</h2><div id="cards" class="cards"></div></section><section id="tracksSection" hidden><div class="section-heading"><h2>Songs</h2><button id="playAll" class="primary">▶ Play playlist</button></div><div id="tracks" class="tracks"></div></section></main></div><footer class="player"><div class="now"><div id="cover" class="cover"></div><div class="song-meta"><strong id="songName">Nothing playing</strong><span id="artistName">Choose a song</span></div></div><div class="center"><div class="controls"><button id="shuffle" title="Shuffle">⇄</button><button id="prev" title="Previous">⏮</button><button id="playPause" class="play-button" title="Play or pause">▶</button><button id="next" title="Next">⏭</button><button id="repeat" title="Repeat: off">↻</button></div><div class="progress"><span id="currentTime">0:00</span><input id="seek" type="range" min="0" max="100" value="0"><span id="duration">0:00</span></div></div><div class="volume">♪ <input id="volume" aria-label="Volume" type="range" min="0" max="1" step="0.01" value="0.8"></div></footer><nav class="mobile-nav" aria-label="Mobile navigation"><button id="mobileHome">⌂<span>Home</span></button><button id="mobileLibrary">▤<span>Library</span></button><button id="mobileNow">♫<span>Now playing</span></button></nav><div class="mobile-sheet" id="mobileSheet" hidden><div class="sheet-head"><strong>Now playing</strong><button id="closeSheet" aria-label="Close player">✕</button></div><div id="sheetArt" class="sheet-art"></div><strong id="sheetTitle">Nothing playing</strong><span id="sheetArtist">Choose a song</span><div class="sheet-controls"><button id="sheetPrev" aria-label="Previous">⏮</button><button id="sheetPlay" aria-label="Play or pause">▶</button><button id="sheetNext" aria-label="Next">⏭</button></div></div><audio id="audio" preload="metadata"></audio><script src="music.js"></script><script src="app.js"></script></body></html>
